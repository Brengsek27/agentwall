[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

# BNB Smart Chain mainnet (chain id 56) - used only for read-only checks here.
[rpc_endpoints]
bsc = "https://bsc-dataseed.binance.org"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", url = "https://api.bscscan.com/api" }
